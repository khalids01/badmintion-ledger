name: Publish update release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-update-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify version and signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure TAURI_SIGNING_PRIVATE_KEY in repository secrets.'; exit 1; }
          test -n "$ANDROID_SIGNING_KEY_BASE64" || { echo 'Configure ANDROID_SIGNING_KEY_BASE64 in repository secrets.'; exit 1; }
          node scripts/verify-release.mjs
  macos:
    needs: prepare
    uses: ./.github/workflows/macos.yml
    with:
      release: true
    secrets: inherit
  android:
    needs: prepare
    uses: ./.github/workflows/android-apk.yml
    with:
      release: true
    secrets: inherit
  publish:
    needs: [macos, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: badminton-ledger-*
          path: release-assets
          merge-multiple: true
      - name: Publish verified installers and updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs
